<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mini Ping Pong</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --bg: #f4efe4;
        --fg: #12211d;
        --court: #3d5f58;
        --line: #f4efe4;
        --accent: #e8736f;
        --muted: #5b6b66;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12211d;
          --fg: #f4efe4;
          --court: #1f3a34;
          --line: #f4efe4;
          --accent: #e8736f;
          --muted: #9db0aa;
        }
      }
      :root[data-theme="dark"] {
        --bg: #12211d;
        --fg: #f4efe4;
        --court: #1f3a34;
        --line: #f4efe4;
        --accent: #e8736f;
        --muted: #9db0aa;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: clamp(18px, 4vw, 26px);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .wrap {
        width: 100%;
        max-width: 640px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 2;
        background: var(--court);
        border: 2px solid var(--fg);
        box-shadow: 8px 8px 0 var(--accent);
        touch-action: none;
        cursor: none;
      }
      .bar {
        display: flex;
        gap: 10px;
        margin-top: 22px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 18px;
        color: var(--fg);
        background: var(--accent);
        border: 2px solid var(--fg);
        box-shadow: 3px 3px 0 var(--fg);
        cursor: pointer;
      }
      button:active {
        transform: translate(3px, 3px);
        box-shadow: 0 0 0 var(--fg);
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      #answer {
        margin-top: 18px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: clamp(15px, 3vw, 20px);
        background: var(--accent);
        color: #12211d;
        border: 2px solid var(--fg);
        box-shadow: 4px 4px 0 var(--fg);
        overflow-wrap: anywhere;
      }
      #answer[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Mini Ping Pong</h1>
    <div class="wrap">
      <canvas
        id="c"
        width="600"
        height="400"
        aria-label="Ping pong game"
      ></canvas>
      <div class="bar">
        <button id="toggle">Start</button>
        <button id="restart">Restart</button>
      </div>
      <div id="answer" hidden></div>
      <p style="margin-top: 12px">
        Move your mouse or finger, or use W/S or ↑/↓. Space starts and pauses.
        Score 10 points to win and reveal the answer.
      </p>
    </div>

    <script>
      const c = document.getElementById("c"),
        g = c.getContext("2d");
      const W = 600,
        H = 400,
        PW = 10,
        PH = 72,
        R = 7,
        WIN = 10,
        PX = 20;
      const ANSWER =
        "Congratulations! You have completed the Level 3 of the Hacktoberfest Puzzle.";
      const AI_SPEED = 2.6;
      let aiErr = 0;
      const p = { y: H / 2 - PH / 2, s: 0 },
        a = { y: H / 2 - PH / 2, s: 0 };
      const b = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
      let speed = 5,
        dir = 1,
        state = "ready",
        keys = {},
        last = performance.now();
      const toggleBtn = document.getElementById("toggle");
      const answerEl = document.getElementById("answer");

      const css = (n) =>
        getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      const clamp = (v) => Math.max(0, Math.min(H - PH, v));

      function resetBall() {
        b.x = W / 2;
        b.y = H / 2;
        b.vx = b.vy = 0;
        speed = 5;
        aiErr = (Math.random() * 2 - 1) * PH * 0.9;
      }
      function serve() {
        const ang = Math.random() * 0.8 - 0.4;
        b.vx = dir * speed * Math.cos(ang);
        b.vy = speed * Math.sin(ang);
        state = "playing";
      }
      function restart() {
        p.s = a.s = 0;
        dir = 1;
        p.y = a.y = H / 2 - PH / 2;
        resetBall();
        state = "ready";
        answerEl.hidden = true;
      }
      function action() {
        if (state === "ready") serve();
        else if (state === "playing") state = "paused";
        else if (state === "paused") state = "playing";
        else if (state === "over") {
          restart();
          serve();
        }
      }

      function update(k) {
        if (keys.up) p.y = clamp(p.y - 6 * k);
        if (keys.down) p.y = clamp(p.y + 6 * k);

        const track = b.vx > 0 && b.x > W * 0.35;
        const target = (track ? b.y + aiErr : H / 2) - PH / 2;
        const diff = target - a.y;
        a.y = clamp(
          a.y + Math.sign(diff) * Math.min(Math.abs(diff), AI_SPEED * k),
        );

        b.x += b.vx * k;
        b.y += b.vy * k;
        if (b.y < R) {
          b.y = R;
          b.vy = Math.abs(b.vy);
        }
        if (b.y > H - R) {
          b.y = H - R;
          b.vy = -Math.abs(b.vy);
        }

        if (
          b.vx < 0 &&
          b.x - R <= PX + PW &&
          b.x + R >= PX &&
          b.y >= p.y - R &&
          b.y <= p.y + PH + R
        ) {
          bounce(p, 1);
          b.x = PX + PW + R;
        }
        const ax = W - PX - PW;
        if (
          b.vx > 0 &&
          b.x + R >= ax &&
          b.x - R <= ax + PW &&
          b.y >= a.y - R &&
          b.y <= a.y + PH + R
        ) {
          bounce(a, -1);
          b.x = ax - R;
        }

        if (b.x < -R) point(a, -1);
        else if (b.x > W + R) point(p, 1);
      }

      function bounce(paddle, d) {
        const rel = (b.y - (paddle.y + PH / 2)) / (PH / 2);
        const ang = rel * 0.9;
        speed = Math.min(speed * 1.05, 10);
        if (d === 1) aiErr = (Math.random() * 2 - 1) * PH * 0.9;
        b.vx = d * speed * Math.cos(ang);
        b.vy = speed * Math.sin(ang);
      }

      function point(who, d) {
        who.s++;
        dir = d === 1 ? 1 : -1;
        resetBall();
        state = who.s >= WIN ? "over" : "ready";
        if (state === "over" && who === p) {
          answerEl.textContent = "Answer: " + ANSWER;
          answerEl.hidden = false;
        }
      }

      function draw() {
        g.fillStyle = css("--court");
        g.fillRect(0, 0, W, H);
        const line = css("--line");
        g.fillStyle = line;
        g.globalAlpha = 0.35;
        for (let y = 8; y < H; y += 24) g.fillRect(W / 2 - 2, y, 4, 12);
        g.globalAlpha = 1;
        g.fillRect(PX, p.y, PW, PH);
        g.fillRect(W - PX - PW, a.y, PW, PH);
        g.fillStyle = css("--accent");
        g.beginPath();
        g.arc(b.x, b.y, R, 0, Math.PI * 2);
        g.fill();

        g.fillStyle = line;
        g.font = "700 40px ui-monospace, Menlo, Consolas, monospace";
        g.textAlign = "center";
        g.fillText(p.s, W / 2 - 60, 50);
        g.fillText(a.s, W / 2 + 60, 50);

        const msg = {
          ready: ["Click or press Space to serve"],
          paused: ["Paused", "Press Space to resume"],
          over:
            p.s > a.s
              ? ["You win!", "Your answer is shown below"]
              : ["AI wins!", "Click or press Space to try again"],
        }[state];
        if (msg) {
          g.fillStyle = "rgba(0,0,0,.45)";
          g.fillRect(0, H / 2 - 50, W, 100);
          g.fillStyle = "#f4efe4";
          g.font = "700 22px ui-monospace, Menlo, Consolas, monospace";
          g.fillText(msg[0], W / 2, H / 2 - (msg[1] ? 6 : -8));
          if (msg[1]) {
            g.font = "400 15px ui-monospace, Menlo, Consolas, monospace";
            g.fillText(msg[1], W / 2, H / 2 + 22);
          }
        }
        toggleBtn.textContent =
          state === "playing"
            ? "Pause"
            : state === "paused"
              ? "Resume"
              : state === "over"
                ? "Play again"
                : "Start";
      }

      function loop(t) {
        const k = Math.min((t - last) / 16.67, 3);
        last = t;
        if (state === "playing") update(k);
        draw();
        requestAnimationFrame(loop);
      }

      function setY(e) {
        const r = c.getBoundingClientRect();
        p.y = clamp((e.clientY - r.top) * (H / r.height) - PH / 2);
      }
      c.addEventListener("pointermove", setY);
      c.addEventListener("pointerdown", (e) => {
        setY(e);
        if (state !== "playing") action();
      });
      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") {
          keys.up = true;
          e.preventDefault();
        } else if (k === "arrowdown" || k === "s") {
          keys.down = true;
          e.preventDefault();
        } else if (k === " " || k === "enter") {
          e.preventDefault();
          if (!e.repeat) action();
        }
      });
      window.addEventListener("keyup", (e) => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = false;
        if (k === "arrowdown" || k === "s") keys.down = false;
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "playing") state = "paused";
      });
      toggleBtn.addEventListener("click", action);
      document.getElementById("restart").addEventListener("click", restart);

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
